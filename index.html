<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Rack Space</title>
<link rel="stylesheet" href="style.css?v=0.1.2" />
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="brand"><span class="dot"></span>RACK SPACE</div>
    <div class="gen" id="genChip">GEN 1</div>
  </header>

  <section class="money">
    <div class="cash" id="cash">$0.00</div>
    <div class="rate"><b id="rate">$0.00</b>/s · <span id="toks">0</span> tok/s</div>
  </section>

  <section class="rack" id="rack">
    <div class="rack-top">
      <span class="lbl">CHIP-01</span>
      <span class="temp" id="tempLbl">35°C</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="fans" id="fans"></div>
    <div class="powerbar"><i id="pwrFill"></i><span id="pwrLbl">0 / 300 W</span></div>
    <div class="heatbar"><i id="heatFill"></i><span id="heatLbl">HEAT 0%</span></div>
  </section>

  <section class="status" id="status" hidden>
    <span id="statusText">THROTTLING</span>
  </section>

  <section class="stats">
    <div class="stat"><span>CORES</span><b id="sCores">1</b></div>
    <div class="stat"><span>CLOCK</span><b id="sClock">1.00</b></div>
    <div class="stat"><span>PSU</span><b id="sPsu">300</b></div>
    <div class="stat"><span>COOLING</span><b id="sCool">1</b></div>
    <div class="stat"><span>BILLING</span><b id="sBill">$0.020</b></div>
    <div class="stat"><span>EFFICIENCY</span><b id="sEff">100%</b></div>
  </section>

  <section class="shop" id="shop"></section>

  <section class="prestige" id="prestigeBox" hidden>
    <div class="pinfo">Generation <b id="pGen">1</b> · next generation pays <b id="pGain">+30%</b></div>
    <button id="prestigeBtn">MIGRATE TO NEW HARDWARE</button>
  </section>

  <footer>
    <span id="ver">Rack Space 0.1.2</span>
    <button id="resetBtn">reset</button>
  </footer>
</div>
<script src="game.js?v=0.1.2"></script>
</body>
</html>
